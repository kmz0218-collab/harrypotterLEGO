<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레고 컬렉션 - LEGO Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">🧱 LEGO COLLECTION</a>
    </div>
  </header>

  <main class="container">

    <div class="page-title">
      <div>
        <p class="eyebrow">MY COLLECTION</p>
        <h1>레고 컬렉션 관리</h1>
        <p class="description">내가 가진 레고를 한눈에 기록하고 관리해보세요.</p>
      </div>
      <button class="primary-button" onclick="openFormModal()">+ 레고 추가</button>
    </div>

    <!-- 요약 카드 -->
    <div class="summary">
      <div class="summary-card card-red">
        <span class="summary-label">전체 레고</span>
        <strong id="statTotal">0개</strong>
      </div>
      <div class="summary-card card-green">
        <span class="summary-label">보유 중</span>
        <strong id="statOwned">0개</strong>
      </div>
      <div class="summary-card card-blue">
        <span class="summary-label">총 매입가</span>
        <strong id="statPurchase">0원</strong>
      </div>
      <div class="summary-card card-purple">
        <span class="summary-label">총 출시가</span>
        <strong id="statRetail">0원</strong>
      </div>
    </div>

    <!-- 검색 / 필터 / 보기 방식 -->
    <div class="toolbar">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="품번 또는 레고명 검색..." oninput="handleSearch()">
      </div>
      <select id="ownedFilter" onchange="handleFilterChange()">
        <option value="ALL">보유 여부: 전체</option>
        <option value="O">보유 중</option>
        <option value="X">미보유</option>
      </select>
      <select id="boxFilter" onchange="handleFilterChange()">
        <option value="ALL">박스 여부: 전체</option>
        <option value="O">박스 있음</option>
        <option value="X">박스 없음</option>
      </select>
      <div class="view-toggle-group">
        <button id="viewGridBtn" class="toggle-button active" onclick="setViewMode('grid')">▦ 카드</button>
        <button id="viewListBtn" class="toggle-button" onclick="setViewMode('list')">☰ 목록</button>
      </div>
    </div>

    <div class="view-title">
      <h2>레고 목록 <span id="resultCount">(0)</span></h2>
    </div>

    <div id="legoGrid" class="lego-grid"></div>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">📦</div>
      <p>조건에 맞는 레고가 없습니다.</p>
    </div>

    <div id="pagination" class="pagination hidden"></div>

  </main>

  <footer class="footer">
    <p>LEGO Collection</p>
    <span>나만의 레고 컬렉션을 기록해보세요.</span>
  </footer>

  <!-- 상세정보 팝업(모달) -->
  <div id="detailModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>레고 상세 정보</h2>
        <button class="modal-close" onclick="closeDetailModal()">✕</button>
      </div>

      <div class="detail-image-wrapper">
        <div class="image-placeholder" style="font-size:56px;">🧱</div>
      </div>

      <div class="detail-header-info">
        <p id="detailNumber" class="lego-number-tag"></p>
        <h3 id="detailName"></h3>
        <span id="detailBadge" class="status-badge"></span>
      </div>

      <div class="detail-row"><span>출시가</span><strong id="detailRetail"></strong></div>
      <div class="detail-row"><span>매입가</span><strong id="detailPurchase"></strong></div>
      <div class="detail-row"><span>박스 여부</span><strong id="detailBoxYn"></strong></div>
      <div class="detail-row"><span>되판 가격</span><strong id="detailResale"></strong></div>

      <div class="detail-memo-box">
        <p class="memo-title">메모</p>
        <p id="detailMemo" class="memo-text"></p>
      </div>

      <div class="modal-actions">
        <button class="delete-button" onclick="deleteCurrentItem()">삭제</button>
        <button class="secondary-button" onclick="editCurrentItem()">수정</button>
        <button class="primary-button" onclick="closeDetailModal()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 추가 / 수정 팝업(모달) -->
  <div id="formModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="formTitle">레고 추가</h2>
        <button class="modal-close" onclick="closeFormModal()">✕</button>
      </div>
      <form id="legoForm" onsubmit="handleFormSubmit(event)">
        <label>레고 품번 *
          <input type="text" id="inputNumber" required>
        </label>
        <label>레고명 *
          <input type="text" id="inputName" required>
        </label>
        <label>보유 여부
          <select id="inputOwned">
            <option value="O">보유</option>
            <option value="X">미보유</option>
          </select>
        </label>
        <label>박스 여부
          <select id="inputBox">
            <option value="O">있음</option>
            <option value="X">없음</option>
          </select>
        </label>
        <label>출시가 (원)
          <input type="number" id="inputRetail" placeholder="0">
        </label>
        <label>매입가 (원)
          <input type="number" id="inputPurchase" placeholder="0">
        </label>
        <label>되판 가격 (원)
          <input type="number" id="inputResale" placeholder="0">
        </label>
        <label>메모
          <textarea id="inputMemo" rows="3"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="secondary-button" onclick="closeFormModal()">취소</button>
          <button type="submit" class="primary-button">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 구글 시트와 연결된 API 주소 (원래 쓰던 것 그대로)
    const API_URL = 'https://script.google.com/macros/s/AKfycbxUnBlqaFdTPU35exUbNzXx6weWhpHpGSwAO96-5ot2qbNLupyuga-As1OnJ45oyeBlAw/exec';

    let legoList = [];         // 구글 시트에서 받아온 전체 레고 목록
    let filteredList = [];     // 검색/필터가 적용된 목록
    let currentView = 'grid';  // 현재 보기 방식 (grid: 카드형 / list: 목록형)
    let currentPage = 1;
    let currentDetailNo = null; // 지금 상세팝업에 열려있는 레고의 품번
    const ITEMS_PER_PAGE = 12;

    document.addEventListener('DOMContentLoaded', fetchData);

    // ===== 데이터 불러오기 =====
    function fetchData() {
      document.getElementById('legoGrid').innerHTML = '<p class="loading">불러오는 중...</p>';
      fetch(API_URL)
        .then(res => res.json())
        .then(response => {
          if (response.success && response.data) {
            legoList = response.data;
            updateStats();
            applyFilters();
          } else {
            alert('데이터를 가져오는데 실패했습니다.');
          }
        })
        .catch(err => {
          console.error(err);
          alert('데이터 연결 중 오류가 발생했습니다.');
        });
    }

    // ===== 상단 요약 카드 숫자 계산 =====
    function updateStats() {
      const total = legoList.length;
      const owned = legoList.filter(i => i['보유 여부'] === 'O').length;
      const totalPurchase = legoList.reduce((sum, i) => sum + (Number(i['매입가']) || 0), 0);
      const totalRetail = legoList.reduce((sum, i) => sum + (Number(i['출시가']) || 0), 0);

      document.getElementById('statTotal').innerText = `${total}개`;
      document.getElementById('statOwned').innerText = `${owned}개`;
      document.getElementById('statPurchase').innerText = formatMoney(totalPurchase);
      document.getElementById('statRetail').innerText = formatMoney(totalRetail);
    }

    // ===== 검색 / 필터 =====
    function handleSearch() {
      currentPage = 1;
      applyFilters();
    }

    function handleFilterChange() {
      currentPage = 1;
      applyFilters();
    }

    function applyFilters() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const owned = document.getElementById('ownedFilter').value;
      const box = document.getElementById('boxFilter').value;

      filteredList = legoList.filter(item => {
        const num = String(item['레고 품번'] || '').toLowerCase();
        const name = String(item['레고명'] || '').toLowerCase();
        const matchKeyword = num.includes(keyword) || name.includes(keyword);

        const matchOwned = owned === 'ALL' || String(item['보유 여부'] || '').toUpperCase() === owned;
        const matchBox = box === 'ALL' || String(item['박스 여부'] || '').toUpperCase() === box;

        return matchKeyword && matchOwned && matchBox;
      });

      renderList();
    }

    // ===== 목록 그리기 =====
    function renderList() {
      const grid = document.getElementById('legoGrid');
      const empty = document.getElementById('emptyState');
      document.getElementById('resultCount').innerText = `(${filteredList.length})`;

      if (filteredList.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        document.getElementById('pagination').classList.add('hidden');
        return;
      }
      empty.classList.add('hidden');

      const totalPages = Math.ceil(filteredList.length / ITEMS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const items = filteredList.slice(start, start + ITEMS_PER_PAGE);

      grid.innerHTML = items.map(cardHTML).join('');
      renderPagination(totalPages);
    }

    // 카드(또는 목록형 줄) 하나를 만드는 함수
    function cardHTML(item) {
      const isOwned = item['보유 여부'] === 'O';
      const no = item['레고 품번'];
      return `
        <div class="lego-card" onclick="openDetailModal('${no}')">
          <span class="status-badge ${isOwned ? 'owned' : 'not-owned'}">${isOwned ? '보유중' : '미보유'}</span>
          <div class="lego-image"><div class="image-placeholder">🧱</div></div>
          <div class="lego-info">
            <p class="lego-number">#${no}</p>
            <h3>${item['레고명']}</h3>
            <div class="info-row"><span>출시가</span><strong>${formatMoney(item['출시가'])}</strong></div>
            <div class="info-row"><span>매입가</span><strong>${formatMoney(item['매입가'])}</strong></div>
          </div>
        </div>`;
    }

    // ===== 페이지 번호 버튼 =====
    function renderPagination(totalPages) {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      el.classList.remove('hidden');

      let html = `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>이전</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>다음</button>`;
      el.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderList();
    }

    // ===== 카드형 / 목록형 전환 =====
    function setViewMode(mode) {
      currentView = mode;
      document.getElementById('legoGrid').classList.toggle('list-view-mode', mode === 'list');
      document.getElementById('viewGridBtn').classList.toggle('active', mode === 'grid');
      document.getElementById('viewListBtn').classList.toggle('active', mode === 'list');
    }

    // ===== 상세정보 팝업(모달) =====
    function openDetailModal(no) {
      const item = legoList.find(i => String(i['레고 품번']) === String(no));
      if (!item) return;
      currentDetailNo = no;

      const isOwned = item['보유 여부'] === 'O';
      document.getElementById('detailNumber').innerText = `#${item['레고 품번']}`;
      document.getElementById('detailName').innerText = item['레고명'];

      const badge = document.getElementById('detailBadge');
      badge.innerText = isOwned ? '보유중' : '미보유';
      badge.className = `status-badge ${isOwned ? 'owned' : 'not-owned'}`;

      document.getElementById('detailRetail').innerText = formatMoney(item['출시가']);
      document.getElementById('detailPurchase').innerText = formatMoney(item['매입가']);
      document.getElementById('detailBoxYn').innerText = item['박스 여부'] === 'O' ? '있음' : '없음';
      document.getElementById('detailResale').innerText = item['되판 가격'] ? formatMoney(item['되판 가격']) : '아직 판매하지 않음';
      document.getElementById('detailMemo').innerText = item['메모'] || '작성된 메모가 없습니다.';

      document.getElementById('detailModal').classList.add('show');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('show');
    }

    function editCurrentItem() {
      const item = legoList.find(i => String(i['레고 품번']) === String(currentDetailNo));
      closeDetailModal();
      openFormModal(item);
    }

    function deleteCurrentItem() {
      const item = legoList.find(i => String(i['레고 품번']) === String(currentDetailNo));
      if (!item) return;
      if (!confirm(`'${item['레고명']}' (#${item['레고 품번']}) 항목을 완전 삭제하시겠습니까?`)) return;

      closeDetailModal();

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', '레고 품번': item['레고 품번'] })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('성공적으로 삭제되었습니다.');
          fetchData();
        } else {
          alert('삭제 실패: ' + (res.error || '알 수 없는 오류'));
        }
      })
      .catch(err => {
        console.error(err);
        alert('삭제 요청 중 오류가 발생했습니다.');
      });
    }

    // ===== 추가 / 수정 팝업(모달) =====
    function openFormModal(item = null) {
      document.getElementById('formTitle').innerText = item ? '레고 정보 수정' : '새 레고 추가';
      const numInput = document.getElementById('inputNumber');

      if (item) {
        numInput.value = item['레고 품번'];
        numInput.readOnly = true; // 수정할 때는 품번을 바꿀 수 없게 막기
        document.getElementById('inputName').value = item['레고명'] || '';
        document.getElementById('inputOwned').value = item['보유 여부'] || 'O';
        document.getElementById('inputBox').value = item['박스 여부'] || 'O';
        document.getElementById('inputRetail').value = item['출시가'] || '';
        document.getElementById('inputPurchase').value = item['매입가'] || '';
        document.getElementById('inputResale').value = item['되판 가격'] || '';
        document.getElementById('inputMemo').value = item['메모'] || '';
      } else {
        document.getElementById('legoForm').reset();
        numInput.readOnly = false;
      }

      document.getElementById('formModal').classList.add('show');
    }

    function closeFormModal() {
      document.getElementById('formModal').classList.remove('show');
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      const payload = {
        '레고 품번': document.getElementById('inputNumber').value,
        '레고명': document.getElementById('inputName').value,
        '보유 여부': document.getElementById('inputOwned').value,
        '박스 여부': document.getElementById('inputBox').value,
        '출시가': Number(document.getElementById('inputRetail').value) || 0,
        '매입가': Number(document.getElementById('inputPurchase').value) || 0,
        '되판 가격': Number(document.getElementById('inputResale').value) || 0,
        '메모': document.getElementById('inputMemo').value
      };

      closeFormModal();

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('성공적으로 저장되었습니다.');
          fetchData();
        } else {
          alert('저장 실패: ' + (res.error || '알 수 없는 오류'));
        }
      })
      .catch(err => {
        console.error(err);
        alert('저장 도중 오류가 발생했습니다.');
      });
    }

    // ===== 돈 표시 형식 (1234567 -> 1,234,567원) =====
    function formatMoney(amount) {
      if (!amount && amount !== 0) return '0원';
      return Number(amount).toLocaleString('ko-KR') + '원';
    }
  </script>
</body>
</html>
