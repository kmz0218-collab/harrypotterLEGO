<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해리포터 레고 컬렉션</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">🪄 해리포터 레고 컬렉션</a>
    </div>
  </header>

  <main class="container">

    <div class="page-title">
      <div>
        <p class="eyebrow">🖤 내 인생을 망치러 온 나의 구원자</p>
        <h1>나의 해리포터 레고 컬렉션</h1>
        <p class="description">모든 해리포터 레고 시리즈를 모을 때까지...(파산핑) 💸</p>
      </div>
      <button class="primary-button" onclick="openFormModal()">🪄 새 세트 소환하기</button>
    </div>

    <!-- 요약 카드 (4개 기숙사 색깔) -->
    <div class="summary">
      <div class="summary-card card-red">
        <span class="summary-label">🦁 전체 소장품</span>
        <strong id="statTotal">0개</strong>
      </div>
      <div class="summary-card card-green">
        <span class="summary-label">🐍 보유 중인 세트</span>
        <strong id="statOwned">0개</strong>
      </div>
      <div class="summary-card card-blue">
        <span class="summary-label">🦅 총 매입 금액</span>
        <strong id="statPurchase">0원</strong>
      </div>
      <div class="summary-card card-purple">
        <span class="summary-label">🦡 총 정가 합계</span>
        <strong id="statRetail">0원</strong>
      </div>
    </div>

    <!-- 검색 / 필터 / 보기 방식 -->
    <div class="toolbar">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="아씨오! 🪄 (세트 번호나 이름으로 소환하기)" oninput="handleSearch()">
      </div>
      <select id="ownedFilter" onchange="handleFilterChange()">
        <option value="ALL">소장 여부: 전체</option>
        <option value="O">소장 중</option>
        <option value="X">미소장</option>
      </select>
      <select id="boxFilter" onchange="handleFilterChange()">
        <option value="ALL">상자 상태: 전체</option>
        <option value="O">상자 있음</option>
        <option value="X">상자 없음</option>
      </select>
      <div class="view-toggle-group">
        <button id="viewGridBtn" class="toggle-button active" onclick="setViewMode('grid')">▦ 카드</button>
        <button id="viewListBtn" class="toggle-button" onclick="setViewMode('list')">☰ 목록</button>
      </div>
    </div>

    <div class="view-title">
      <h2>나의 컬렉션 <span id="resultCount">(0)</span></h2>
    </div>

    <div id="legoGrid" class="lego-grid"></div>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">🪶</div>
      <p>조건에 맞는 마법 물품을 찾지 못했어요.</p>
    </div>

    <div id="pagination" class="pagination hidden"></div>

  </main>

  <footer class="footer">
    <p>Harry Potter LEGO Collection</p>
    <span>나만의 작은 호그와트를 기록해보세요. ⚡🪄</span>
  </footer>

  <!-- 상세정보 팝업(모달) -->
  <div id="detailModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>세트 상세 정보</h2>
        <button class="modal-close" onclick="closeDetailModal()">✕</button>
      </div>

      <div class="detail-image-wrapper">
        <span id="detailBadge" class="status-badge"></span>
        <img id="detailImage" src="" alt="세트 이미지" style="display:none;">
        <div id="detailImagePlaceholder" class="image-placeholder" style="font-size:56px;">🧱</div>
      </div>

      <div class="detail-header-info">
        <p id="detailNumber" class="lego-number-tag"></p>
        <h3 id="detailName"></h3>
      </div>

      <div class="detail-row"><span>정가</span><strong id="detailRetail"></strong></div>
      <div class="detail-row"><span>매입가</span><strong id="detailPurchase"></strong></div>
      <div class="detail-row"><span>상자 여부</span><strong id="detailBoxYn"></strong></div>
      <div class="detail-row"><span>되판 가격</span><strong id="detailResale"></strong></div>

      <div class="detail-memo-box">
        <p class="memo-title">✒️ 마법 일지</p>
        <p id="detailMemo" class="memo-text"></p>
      </div>

      <div class="modal-actions">
        <button class="delete-button" onclick="deleteCurrentItem()">삭제</button>
        <button class="secondary-button" onclick="editCurrentItem()">수정</button>
        <button class="primary-button" onclick="closeDetailModal()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 추가 / 수정 팝업(모달) -->
  <div id="formModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="formTitle">새 세트 소환하기</h2>
        <button class="modal-close" onclick="closeFormModal()">✕</button>
      </div>

      <div class="detail-image-wrapper" style="margin-bottom:14px;">
        <img id="formPreviewImage" src="" alt="세트 미리보기" style="display:none;">
        <div id="formPreviewPlaceholder" class="image-placeholder" style="font-size:44px;">🧱</div>
      </div>

      <form id="legoForm" onsubmit="handleFormSubmit(event)">
        <label>세트 번호 *
          <input type="text" id="inputNumber" required oninput="updateFormPreview()">
        </label>
        <label>세트 이름 *
          <input type="text" id="inputName" required>
        </label>
        <label>소장 여부
          <select id="inputOwned">
            <option value="O">소장 중</option>
            <option value="X">미소장</option>
          </select>
        </label>
        <label>정가 (원)
          <input type="text" inputmode="numeric" id="inputRetail" placeholder="0" oninput="formatNumberInput(this)">
        </label>
        <label>매입가 (원)
          <input type="text" inputmode="numeric" id="inputPurchase" placeholder="0" oninput="formatNumberInput(this); updateBoxAvailability();">
        </label>
        <label>상자 여부 <span style="font-weight:400;color:var(--text-muted);">(매입가를 입력하면 선택할 수 있어요)</span>
          <select id="inputBox">
            <option value="O">있음</option>
            <option value="X">없음</option>
          </select>
        </label>
        <label>되판 가격 (원)
          <input type="text" inputmode="numeric" id="inputResale" placeholder="0" oninput="formatNumberInput(this)">
        </label>
        <label>마법 일지 (메모)
          <textarea id="inputMemo" rows="3"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="secondary-button" onclick="closeFormModal()">취소</button>
          <button type="submit" class="primary-button">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 구글 시트와 연결된 API 주소 (원래 쓰던 것 그대로)
    const API_URL = 'https://script.google.com/macros/s/AKfycbxUnBlqaFdTPU35exUbNzXx6weWhpHpGSwAO96-5ot2qbNLupyuga-As1OnJ45oyeBlAw/exec';

    let legoList = [];         // 구글 시트에서 받아온 전체 세트 목록
    let filteredList = [];     // 검색/필터가 적용된 목록
    let currentView = 'grid';  // 현재 보기 방식 (grid: 카드형 / list: 목록형)
    let currentPage = 1;
    let currentDetailNo = null; // 지금 상세팝업에 열려있는 세트의 번호
    const ITEMS_PER_PAGE = 12;

    document.addEventListener('DOMContentLoaded', fetchData);

    // ===== 세트 번호로 사진 주소 만들기 =====
    // 브릭링크(BrickLink)라는 사이트가 세트 번호별 사진을 무료로 제공해줘서, 그 주소 규칙을 그대로 이용해요.
    // 사진이 없는 세트라면 onerror가 실행돼서 자동으로 🧱 아이콘으로 바뀌어요.
    function getImageUrl(no) {
      const cleanNo = String(no).trim().split('-')[0]; // 혹시 "76391-1"처럼 적혀있어도 앞부분만 사용
      return `https://img.bricklink.com/ItemImage/SN/0/${cleanNo}-1.png`;
    }

    // ===== 데이터 불러오기 =====
    function fetchData() {
      document.getElementById('legoGrid').innerHTML = '<p class="loading">마법 지팡이를 휘두르는 중...</p>';
      fetch(API_URL)
        .then(res => res.json())
        .then(response => {
          if (response.success && response.data) {
            legoList = response.data;
            updateStats();
            applyFilters();
          } else {
            alert('데이터를 가져오는데 실패했습니다.');
          }
        })
        .catch(err => {
          console.error(err);
          alert('데이터 연결 중 오류가 발생했습니다.');
        });
    }

    // ===== 상단 요약 카드 숫자 계산 =====
    function updateStats() {
      const total = legoList.length;
      const owned = legoList.filter(i => i['보유 여부'] === 'O').length;
      const totalPurchase = legoList.reduce((sum, i) => sum + (Number(i['매입가']) || 0), 0);
      const totalRetail = legoList.reduce((sum, i) => sum + (Number(i['출시가']) || 0), 0);

      document.getElementById('statTotal').innerText = `${total}개`;
      document.getElementById('statOwned').innerText = `${owned}개`;
      document.getElementById('statPurchase').innerText = formatMoney(totalPurchase);
      document.getElementById('statRetail').innerText = formatMoney(totalRetail);
    }

    // ===== 검색 / 필터 =====
    function handleSearch() {
      currentPage = 1;
      applyFilters();
    }

    function handleFilterChange() {
      currentPage = 1;
      applyFilters();
    }

    function applyFilters() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const owned = document.getElementById('ownedFilter').value;
      const box = document.getElementById('boxFilter').value;

      filteredList = legoList.filter(item => {
        const num = String(item['레고 품번'] || '').toLowerCase();
        const name = String(item['레고명'] || '').toLowerCase();
        const matchKeyword = num.includes(keyword) || name.includes(keyword);

        const matchOwned = owned === 'ALL' || String(item['보유 여부'] || '').toUpperCase() === owned;
        const matchBox = box === 'ALL' || String(item['박스 여부'] || '').toUpperCase() === box;

        return matchKeyword && matchOwned && matchBox;
      });

      // 기본적으로 세트 번호(품번) 오름차순으로 정렬 (숫자로 비교해서 76391 같은 번호도 자연스럽게 정렬됨)
      filteredList.sort((a, b) => {
        const noA = String(a['레고 품번'] || '');
        const noB = String(b['레고 품번'] || '');
        return noA.localeCompare(noB, undefined, { numeric: true });
      });

      renderList();
    }

    // ===== 목록 그리기 =====
    function renderList() {
      const grid = document.getElementById('legoGrid');
      const empty = document.getElementById('emptyState');
      document.getElementById('resultCount').innerText = `(${filteredList.length})`;

      if (filteredList.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        document.getElementById('pagination').classList.add('hidden');
        return;
      }
      empty.classList.add('hidden');

      const totalPages = Math.ceil(filteredList.length / ITEMS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const items = filteredList.slice(start, start + ITEMS_PER_PAGE);

      grid.innerHTML = items.map(cardHTML).join('');
      renderPagination(totalPages);
    }

    // 카드(또는 목록형 줄) 하나를 만드는 함수
    function cardHTML(item) {
      const isOwned = item['보유 여부'] === 'O';
      const no = item['레고 품번'];
      const imgUrl = getImageUrl(no);
      return `
        <div class="lego-card" onclick="openDetailModal('${no}')">
          <div class="lego-image">
            <img src="${imgUrl}" alt="${item['레고명']}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
            <div class="image-placeholder" style="display:none;">🧱</div>
          </div>
          <div class="lego-info">
            <p class="lego-number">#${no}</p>
            <h3>${item['레고명']}</h3>
            <div class="info-row"><span>정가</span><strong>${formatMoney(item['출시가'])}</strong></div>
            <div class="info-row"><span>매입가</span><strong>${formatMoney(item['매입가'])}</strong></div>
          </div>
          <span class="status-badge ${isOwned ? 'owned' : 'not-owned'}">${isOwned ? '소장 중' : '미소장'}</span>
        </div>`;
    }

    // ===== 페이지 번호 버튼 =====
    function renderPagination(totalPages) {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      el.classList.remove('hidden');

      let html = `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>이전</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>다음</button>`;
      el.innerHTML = html;
    }

    function changePage(p) {
      currentPage = p;
      renderList();
    }

    // ===== 카드형 / 목록형 전환 =====
    function setViewMode(mode) {
      currentView = mode;
      document.getElementById('legoGrid').classList.toggle('list-view-mode', mode === 'list');
      document.getElementById('viewGridBtn').classList.toggle('active', mode === 'grid');
      document.getElementById('viewListBtn').classList.toggle('active', mode === 'list');
    }

    // ===== 상세정보 팝업(모달) =====
    function openDetailModal(no) {
      const item = legoList.find(i => String(i['레고 품번']) === String(no));
      if (!item) return;
      currentDetailNo = no;

      const isOwned = item['보유 여부'] === 'O';
      document.getElementById('detailNumber').innerText = `#${item['레고 품번']}`;
      document.getElementById('detailName').innerText = item['레고명'];

      const badge = document.getElementById('detailBadge');
      badge.innerText = isOwned ? '소장 중' : '미소장';
      badge.className = `status-badge ${isOwned ? 'owned' : 'not-owned'}`;

      // 상세팝업 사진도 자동으로 불러오기
      const img = document.getElementById('detailImage');
      const placeholder = document.getElementById('detailImagePlaceholder');
      img.src = getImageUrl(no);
      img.style.display = 'block';
      placeholder.style.display = 'none';
      img.onerror = () => { img.style.display = 'none'; placeholder.style.display = 'flex'; };

      document.getElementById('detailRetail').innerText = formatMoney(item['출시가']);
      document.getElementById('detailPurchase').innerText = formatMoney(item['매입가']);
      document.getElementById('detailBoxYn').innerText = item['박스 여부'] === 'O' ? '있음' : '없음';
      document.getElementById('detailResale').innerText = item['되판 가격'] ? formatMoney(item['되판 가격']) : '아직 판매하지 않음';
      document.getElementById('detailMemo').innerText = item['메모'] || '작성된 메모가 없습니다.';

      document.getElementById('detailModal').classList.add('show');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('show');
    }

    function editCurrentItem() {
      const item = legoList.find(i => String(i['레고 품번']) === String(currentDetailNo));
      closeDetailModal();
      openFormModal(item);
    }

    function deleteCurrentItem() {
      const item = legoList.find(i => String(i['레고 품번']) === String(currentDetailNo));
      if (!item) return;
      if (!confirm(`'${item['레고명']}' (#${item['레고 품번']}) 항목을 정말 삭제하시겠습니까? 이 마법은 되돌릴 수 없어요.`)) return;

      closeDetailModal();

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', '레고 품번': item['레고 품번'] })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('세트가 컬렉션에서 사라졌습니다. ✨');
          fetchData();
        } else {
          alert('삭제 실패: ' + (res.error || '알 수 없는 오류'));
        }
      })
      .catch(err => {
        console.error(err);
        alert('삭제 요청 중 오류가 발생했습니다.');
      });
    }

    // ===== 추가 / 수정 팝업(모달) =====
    function openFormModal(item = null) {
      document.getElementById('formTitle').innerText = item ? '세트 정보 수정' : '새 세트 소환하기';
      const numInput = document.getElementById('inputNumber');

      if (item) {
        numInput.value = item['레고 품번'];
        numInput.readOnly = true; // 수정할 때는 세트 번호를 바꿀 수 없게 막기
        document.getElementById('inputName').value = item['레고명'] || '';
        document.getElementById('inputOwned').value = item['보유 여부'] || 'O';
        document.getElementById('inputBox').value = item['박스 여부'] || 'O';
        document.getElementById('inputRetail').value = item['출시가'] ? Number(item['출시가']).toLocaleString('ko-KR') : '';
        document.getElementById('inputPurchase').value = item['매입가'] ? Number(item['매입가']).toLocaleString('ko-KR') : '';
        document.getElementById('inputResale').value = item['되판 가격'] ? Number(item['되판 가격']).toLocaleString('ko-KR') : '';
        document.getElementById('inputMemo').value = item['메모'] || '';
      } else {
        document.getElementById('legoForm').reset();
        numInput.readOnly = false;
      }

      updateFormPreview();
      updateBoxAvailability();
      document.getElementById('formModal').classList.add('show');
    }

    function closeFormModal() {
      document.getElementById('formModal').classList.remove('show');
    }

    // 가격 입력칸에 천단위 콤마(,)를 자동으로 넣어주는 함수
    // 예: "400000" 입력 -> 화면에는 "400,000"으로 보여줌
    function formatNumberInput(el) {
      const raw = el.value.replace(/[^0-9]/g, ''); // 숫자만 남기기
      el.value = raw === '' ? '' : Number(raw).toLocaleString('ko-KR');
    }

    // 콤마가 찍힌 입력값을 다시 순수 숫자로 되돌리는 함수 (저장할 때 사용)
    function getRawNumber(inputId) {
      const raw = document.getElementById(inputId).value.replace(/[^0-9]/g, '');
      return raw === '' ? 0 : Number(raw);
    }

    // 매입가를 입력했을 때만 "상자 여부"를 선택할 수 있도록 켜고 끄는 함수
    function updateBoxAvailability() {
      const purchase = getRawNumber('inputPurchase');
      const boxSelect = document.getElementById('inputBox');
      const canSelect = purchase > 0;
      boxSelect.disabled = !canSelect;
      if (!canSelect) {
        boxSelect.value = 'X'; // 매입가가 없으면 자동으로 "없음"으로 되돌리기
      }
    }

    // 입력 폼에서 세트 번호를 입력할 때마다 미리보기 사진 갱신
    function updateFormPreview() {
      const no = document.getElementById('inputNumber').value.trim();
      const img = document.getElementById('formPreviewImage');
      const placeholder = document.getElementById('formPreviewPlaceholder');

      if (!no) {
        img.style.display = 'none';
        placeholder.style.display = 'flex';
        return;
      }

      img.src = getImageUrl(no);
      img.style.display = 'block';
      placeholder.style.display = 'none';
      img.onerror = () => { img.style.display = 'none'; placeholder.style.display = 'flex'; };
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      const payload = {
        '레고 품번': document.getElementById('inputNumber').value,
        '레고명': document.getElementById('inputName').value,
        '보유 여부': document.getElementById('inputOwned').value,
        '박스 여부': document.getElementById('inputBox').value,
        '출시가': getRawNumber('inputRetail'),
        '매입가': getRawNumber('inputPurchase'),
        '되판 가격': getRawNumber('inputResale'),
        '메모': document.getElementById('inputMemo').value
      };

      closeFormModal();

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('마법처럼 저장되었습니다! ✨');
          fetchData();
        } else {
          alert('저장 실패: ' + (res.error || '알 수 없는 오류'));
        }
      })
      .catch(err => {
        console.error(err);
        alert('저장 도중 오류가 발생했습니다.');
      });
    }

    // ===== 돈 표시 형식 (1234567 -> 1,234,567원) =====
    function formatMoney(amount) {
      if (!amount && amount !== 0) return '0원';
      return Number(amount).toLocaleString('ko-KR') + '원';
    }
  </script>
</body>
