```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hogwarts LEGO Collection</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="logo">
      🪄 Hogwarts LEGO Collection
    </div>

    <nav class="nav">
      <a href="#" class="active">컬렉션</a>
    </nav>

  </div>
</header>


<main class="container">

  <section class="page-title">

    <div>
      <p class="eyebrow">MY HARRY POTTER LEGO</p>

      <h1>나의 레고 컬렉션</h1>

      <p class="description">
        내가 가진 해리포터 레고와 구매·판매 기록을 한눈에 관리하세요.
      </p>
    </div>

    <button
      type="button"
      class="primary-button"
      onclick="openAddModal()"
    >
      ＋ 레고 추가
    </button>

  </section>


  <!-- 요약 -->

  <section class="summary">

    <div class="summary-card gryffindor">
      <span class="summary-label">보유 레고</span>
      <strong id="ownedCount">0개</strong>
    </div>

    <div class="summary-card slytherin">
      <span class="summary-label">전체 매입 금액</span>
      <strong id="totalPurchase">0원</strong>
    </div>

    <div class="summary-card ravenclaw">
      <span class="summary-label">출시가와 매입가 차이</span>
      <strong id="priceDifference">0원</strong>
    </div>

    <div class="summary-card highlight">
      <span class="summary-label">보유 레고 총 가치</span>
      <strong id="totalValue">0원</strong>
    </div>

  </section>


  <!-- 검색 / 필터 / 정렬 -->

  <section class="toolbar">

    <div class="search-box">
      <span>⌕</span>

      <input
        type="text"
        id="searchInput"
        placeholder="품번이나 레고명을 검색하세요"
        oninput="renderLegoList()"
      >
    </div>


    <select
      id="statusFilter"
      onchange="renderLegoList()"
    >
      <option value="전체">보유 여부 전체</option>
      <option value="보유">보유</option>
      <option value="판매함">판매함</option>
      <option value="미보유">미보유</option>
    </select>


    <select
      id="sortSelect"
      onchange="renderLegoList()"
    >
      <option value="number">품번순</option>
      <option value="name">이름순</option>
      <option value="releaseHigh">출시가 높은순</option>
      <option value="releaseLow">출시가 낮은순</option>
      <option value="purchaseHigh">매입가 높은순</option>
      <option value="purchaseLow">매입가 낮은순</option>
    </select>


    <!-- 보기 방식 -->

    <div class="view-buttons">

      <button
        type="button"
        id="cardViewButton"
        class="view-button active"
        onclick="changeView('card')"
        title="카드형"
      >
        ▦
      </button>

      <button
        type="button"
        id="listViewButton"
        class="view-button"
        onclick="changeView('list')"
        title="목록형"
      >
        ☷
      </button>

    </div>

  </section>


  <section>

    <div class="view-title">

      <h2>
        레고 목록
        <span id="legoCount">0</span>
      </h2>

    </div>


    <div
      class="lego-grid card-mode"
      id="legoGrid"
    ></div>

  </section>

</main>


<footer class="footer">

  <p>Hogwarts LEGO Collection</p>

  <span>
    나만의 해리포터 레고 기록장
  </span>

</footer>


<!-- =========================
     레고 추가 모달
========================= -->

<div
  class="modal"
  id="addModal"
  onclick="closeModalBackground(event)"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>레고 추가</h2>

      <button
        type="button"
        class="modal-close"
        onclick="closeAddModal()"
      >
        ×
      </button>

    </div>


    <form id="legoForm">

      <label>
        레고 품번

        <input
          type="text"
          id="legoNumber"
          placeholder="예: 76391"
          required
        >
      </label>


      <label>
        레고명

        <input
          type="text"
          id="legoName"
          placeholder="예: 호그와트 아이콘"
          required
        >
      </label>


      <label>
        출시가

        <input
          type="number"
          id="releasePrice"
          placeholder="예: 399900"
          min="0"
        >
      </label>


      <label>
        보유 여부

        <select id="ownership">

          <option value="보유">보유</option>
          <option value="판매함">판매함</option>
          <option value="미보유">미보유</option>

        </select>
      </label>


      <label>
        박스 여부

        <select id="boxStatus">

          <option value="박스 있음">박스 있음</option>
          <option value="박스 없음">박스 없음</option>

        </select>
      </label>


      <label>
        매입가

        <input
          type="number"
          id="purchasePrice"
          placeholder="예: 350000"
          min="0"
        >
      </label>


      <label>
        되판 가격

        <input
          type="number"
          id="soldPrice"
          placeholder="실제로 판매했을 때만 입력"
          min="0"
        >
      </label>


      <label>
        메모

        <textarea
          id="memo"
          rows="4"
          placeholder="박스 상태, 구매처 등을 적어주세요."
        ></textarea>
      </label>


      <div class="modal-actions">

        <button
          type="button"
          class="secondary-button"
          onclick="closeAddModal()"
        >
          취소
        </button>

        <button
          type="submit"
          class="primary-button"
        >
          저장하기
        </button>

      </div>

    </form>

  </div>

</div>


<script>

/* =========================
   Apps Script 주소
========================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbynG6GdKR3sd9JDH_fMTM9LOx637JIxqjd_DA5XxmxSG93w-9UJTfh5RDSqGTrm3ndR7Q/exec';


/* =========================
   데이터
========================= */

let legoList = [];


/* =========================
   현재 보기 방식
========================= */

let currentView = 'card';


/* =========================
   시작
========================= */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    loadLegoData();

    document
      .getElementById('legoForm')
      .addEventListener(
        'submit',
        saveLego
      );

  }
);


/* =========================
   데이터 불러오기
========================= */

async function loadLegoData() {

  showLoading();

  try {

    const response =
      await fetch(API_URL);

    const result =
      await response.json();

    if (!result.success) {

      throw new Error(
        result.error ||
        '데이터를 불러오지 못했습니다.'
      );

    }

    legoList =
      Array.isArray(result.data)
        ? result.data
        : [];


    /*
     * 데이터를 불러온 직후
     * 기본 품번순으로 정렬합니다.
     */
    legoList.sort(function(a, b) {

      return String(a['레고 품번'] || '')
        .localeCompare(
          String(b['레고 품번'] || ''),
          undefined,
          { numeric: true }
        );

    });


    renderLegoList();

    updateSummary();

  } catch (error) {

    console.error(error);

    showError(
      '레고 목록을 불러오지 못했습니다.<br>' +
      'Apps Script 배포 설정과 주소를 확인해주세요.'
    );

  }

}


/* =========================
   목록 표시
========================= */

function renderLegoList() {

  const grid =
    document.getElementById('legoGrid');


  const keyword =
    document
      .getElementById('searchInput')
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById('statusFilter')
      .value;


  const sort =
    document
      .getElementById('sortSelect')
      .value;


  let filtered =
    legoList.filter(function(item) {

      const number =
        String(item['레고 품번'] || '')
          .toLowerCase();


      const name =
        String(item['레고명'] || '')
          .toLowerCase();


      const matchesSearch =
        !keyword ||
        number.includes(keyword) ||
        name.includes(keyword);


      const matchesStatus =
        status === '전체' ||
        String(item['보유 여부'] || '') === status;


      return (
        matchesSearch &&
        matchesStatus
      );

    });


  /* 정렬 */

  filtered.sort(function(a, b) {

    switch (sort) {

      case 'number':

        return String(a['레고 품번'] || '')
          .localeCompare(
            String(b['레고 품번'] || ''),
            undefined,
            { numeric: true }
          );


      case 'name':

        return String(a['레고명'] || '')
          .localeCompare(
            String(b['레고명'] || ''),
            'ko'
          );


      case 'releaseHigh':

        return (
          toNumber(b['출시가']) -
          toNumber(a['출시가'])
        );


      case 'releaseLow':

        return (
          toNumber(a['출시가']) -
          toNumber(b['출시가'])
        );


      case 'purchaseHigh':

        return (
          toNumber(b['매입가']) -
          toNumber(a['매입가'])
        );


      case 'purchaseLow':

        return (
          toNumber(a['매입가']) -
          toNumber(b['매입가'])
        );


      default:

        return 0;

    }

  });


  document.getElementById(
    'legoCount'
  ).textContent =
    filtered.length;


  if (filtered.length === 0) {

    grid.innerHTML = `

      <div class="empty-state">

        <div class="empty-icon">
          🧱
        </div>

        <h3>
          아직 레고가 없습니다.
        </h3>

        <p>
          검색 조건을 바꾸거나
          오른쪽 위의 '레고 추가' 버튼으로
          레고를 등록해보세요.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(createLegoCard)
      .join('');
```
