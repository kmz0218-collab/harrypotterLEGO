<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harry Potter LEGO Collection</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="logo">
      🪄 Harry Potter LEGO Collection
    </div>

    <nav class="nav">
      <a href="#" class="active">컬렉션</a>
    </nav>

  </div>
</header>


<main class="container">

  <section class="page-title">

    <div>
      <p class="eyebrow">MY HARRY POTTER LEGO</p>

      <h1>나의 레고 컬렉션</h1>

      <p class="description">
        내가 가진 해리포터 레고와 구매·판매 기록을 한눈에 관리하세요.
      </p>
    </div>

    <button
      type="button"
      class="primary-button"
      onclick="openAddModal()"
    >
      ＋ 레고 추가
    </button>

  </section>


  <!-- 요약 정보 -->

  <section class="summary">

    <div class="summary-card gryffindor">
      <span class="summary-label">보유 레고</span>
      <strong id="ownedCount">0개</strong>
    </div>

    <div class="summary-card slytherin">
      <span class="summary-label">전체 매입 금액</span>
      <strong id="totalPurchase">0원</strong>
    </div>

    <div class="summary-card ravenclaw">
      <span class="summary-label">출시가와 매입가 차이</span>
      <strong id="priceDifference">0원</strong>
    </div>

    <div class="summary-card highlight">
      <span class="summary-label">보유 레고 총 가치</span>
      <strong id="totalValue">0원</strong>
    </div>

  </section>


  <!-- 검색 / 정렬 / 보기 설정 -->

  <section class="toolbar">

    <div class="search-box">

      <span>⌕</span>

      <input
        type="text"
        id="searchInput"
        placeholder="품번이나 레고명을 검색하세요"
        oninput="renderLegoList()"
      >

    </div>


    <select id="statusFilter" onchange="renderLegoList()">

      <option value="전체">보유 여부 전체</option>
      <option value="보유">보유</option>
      <option value="판매함">판매함</option>
      <option value="미보유">미보유</option>

    </select>


    <select id="sortSelect" onchange="renderLegoList()">

      <option value="default">기본순</option>
      <option value="number">품번순</option>
      <option value="name">이름순</option>
      <option value="releaseHigh">출시가 높은순</option>
      <option value="releaseLow">출시가 낮은순</option>
      <option value="purchaseHigh">매입가 높은순</option>
      <option value="purchaseLow">매입가 낮은순</option>

    </select>

    <!-- 보기 방식 전환 버튼 (카드형 / 목록형) -->
    <div class="view-toggle-group">
      <button 
        type="button" 
        id="btnCardView" 
        class="toggle-button active" 
        onclick="switchView('grid')"
      >
        🂠 카드형
      </button>
      <button 
        type="button" 
        id="btnListView" 
        class="toggle-button" 
        onclick="switchView('list')"
      >
        ☰ 목록형
      </button>
    </div>

  </section>


  <section>

    <div class="view-title">

      <h2>
        레고 목록
        <span id="legoCount">0</span>
      </h2>

    </div>


    <div
      class="lego-grid"
      id="legoGrid"
    ></div>

  </section>

</main>


<footer class="footer">

  <p>Harry Potter LEGO Collection</p>

  <span>
    나만의 해리포터 레고 기록장
  </span>

</footer>


<!-- =========================
     레고 추가 모달
========================= -->

<div
  class="modal"
  id="addModal"
  onclick="closeModalBackground(event, 'addModal')"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>레고 추가</h2>

      <button
        type="button"
        class="modal-close"
        onclick="closeAddModal()"
      >
        ×
      </button>

    </div>


    <form id="legoForm">

      <label>
        레고 품번

        <input
          type="text"
          id="legoNumber"
          placeholder="예: 76391"
          required
        >

      </label>


      <label>
        레고명

        <input
          type="text"
          id="legoName"
          placeholder="예: 호그와트 아이콘"
          required
        >

      </label>


      <label>
        출시가

        <input
          type="number"
          id="releasePrice"
          placeholder="예: 399900"
          min="0"
        >

      </label>


      <label>
        보유 여부

        <select id="ownership">

          <option value="보유">보유</option>
          <option value="판매함">판매함</option>
          <option value="미보유">미보유</option>

        </select>

      </label>


      <label>
        박스 여부

        <select id="boxStatus">

          <option value="박스 있음">박스 있음</option>
          <option value="박스 없음">박스 없음</option>

        </select>

      </label>


      <label>
        매입가

        <input
          type="number"
          id="purchasePrice"
          placeholder="예: 350000"
          min="0"
        >

      </label>


      <label>
        되판 가격

        <input
          type="number"
          id="soldPrice"
          placeholder="실제로 판매했을 때만 입력"
          min="0"
        >

      </label>


      <label>
        메모

        <textarea
          id="memo"
          rows="4"
          placeholder="박스 상태, 구매처 등을 적어주세요."
        ></textarea>

      </label>


      <div class="modal-actions">

        <button
          type="button"
          class="secondary-button"
          onclick="closeAddModal()"
        >
          취소
        </button>

        <button
          type="submit"
          class="primary-button"
        >
          저장하기
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =========================
     레고 상세 보기 모달
========================= -->

<div
  class="modal"
  id="detailModal"
  onclick="closeModalBackground(event, 'detailModal')"
>

  <div class="modal-box detail-box">

    <div class="modal-header">

      <h2>레고 상세 보기</h2>

      <button
        type="button"
        class="modal-close"
        onclick="closeDetailModal()"
      >
        ×
      </button>

    </div>


    <div class="detail-content">

      <div class="detail-image-wrapper">
        <img id="detailImage" src="" alt="레고 이미지">
      </div>

      <div class="detail-info-group">
        
        <div class="detail-header-info">
          <span id="detailNumber" class="lego-number-tag"></span>
          <h3 id="detailName"></h3>
          <span id="detailBadge" class="status-badge"></span>
        </div>

        <hr class="detail-divider">

        <div class="detail-row">
          <span>출시가</span>
          <strong id="detailReleasePrice"></strong>
        </div>

        <div class="detail-row">
          <span>매입가</span>
          <strong id="detailPurchasePrice"></strong>
        </div>

        <div id="detailSoldRow" class="detail-row sold-price hidden">
          <span>되판 가격</span>
          <strong id="detailSoldPrice"></strong>
        </div>

        <div class="detail-row">
          <span>박스 상태</span>
          <strong id="detailBoxStatus"></strong>
        </div>

        <div class="detail-memo-box">
          <p class="memo-title">메모</p>
          <p id="detailMemo" class="memo-text"></p>
        </div>

      </div>

    </div>

    <div class="modal-actions">
      <button
        type="button"
        class="secondary-button"
        onclick="closeDetailModal()"
      >
        닫기
      </button>
    </div>

  </div>

</div>


<script>

  /* =========================
     Apps Script 웹앱 주소
  ========================= */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbynG6GdKR3sd9JDH_fMTM9LOx637JIxqjd_DA5XxmxSG93w-9UJTfh5RDSqGTrm3ndR7Q/exec';


  /* =========================
     현재 레고 데이터 및 보기 방식
  ========================= */

  let legoList = [];
  let currentViewMode = 'grid'; // 'grid' 또는 'list'


  /* =========================
     페이지 시작
  ========================= */

  document.addEventListener(
    'DOMContentLoaded',
    function() {

      loadLegoData();

      document
        .getElementById('legoForm')
        .addEventListener(
          'submit',
          saveLego
        );

    }
  );


  /* =========================
     품번으로 이미지 URL 얻기
  ========================= */

  function getLegoImageUrl(item) {
    if (item['사진 URL'] && item['사진 URL'].trim() !== '') {
      return item['사진 URL'].trim();
    }

    const number = String(item['레고 품번'] || '').trim();
    if (!number) return '';

    // 숫자 형태만 정제 (예: '76391-1' 또는 '76391' -> '76391')
    const cleanNumber = number.replace(/[^0-9]/g, '');
    if (!cleanNumber) return '';

    // 레고 공식 CDN 서버 표준 포맷 주소
    return `https://images.brickset.com/sets/images/${cleanNumber}-1.jpg`;
  }


  /* =========================
     스프레드시트에서 데이터 가져오기
  ========================= */

  async function loadLegoData() {

    showLoading();

    try {

      const response =
        await fetch(API_URL);

      const result =
        await response.json();

      if (!result.success) {
        throw new Error(
          result.error || '데이터를 불러오지 못했습니다.'
        );
      }

      legoList =
        Array.isArray(result.data)
          ? result.data
          : [];

      renderLegoList();
      updateSummary();

    } catch (error) {

      console.error(error);

      showError(
        '레고 목록을 불러오지 못했습니다.<br>' +
        'Apps Script 배포 설정과 주소를 확인해주세요.'
      );

    }

  }


  /* =========================
     카드/목록 보기 전환
  ========================= */

  function switchView(mode) {
    currentViewMode = mode;

    const btnCard = document.getElementById('btnCardView');
    const btnList = document.getElementById('btnListView');
    const legoGrid = document.getElementById('legoGrid');

    if (mode === 'list') {
      btnList.classList.add('active');
      btnCard.classList.remove('active');
      legoGrid.classList.add('list-view-mode');
    } else {
      btnCard.classList.add('active');
      btnList.classList.remove('active');
      legoGrid.classList.remove('list-view-mode');
    }

    renderLegoList();
  }


  /* =========================
     레고 목록 화면 표시
  ========================= */

  function renderLegoList() {

    const grid =
      document.getElementById('legoGrid');

    const keyword =
      document
        .getElementById('searchInput')
        .value
        .trim()
        .toLowerCase();

    const status =
      document
        .getElementById('statusFilter')
        .value;

    const sort =
      document
        .getElementById('sortSelect')
        .value;


    let filtered =
      legoList.filter(function(item) {

        const number =
          String(item['레고 품번'] || '')
            .toLowerCase();

        const name =
          String(item['레고명'] || '')
            .toLowerCase();

        const matchesSearch =
          !keyword ||
          number.includes(keyword) ||
          name.includes(keyword);

        const matchesStatus =
          status === '전체' ||
          String(item['보유 여부'] || '') === status;

        return (
          matchesSearch &&
          matchesStatus
        );

      });


    filtered.sort(function(a, b) {

      switch (sort) {

        case 'number':
          return String(a['레고 품번'] || '')
            .localeCompare(
              String(b['레고 품번'] || ''),
              undefined,
              { numeric: true }
            );

        case 'name':
          return String(a['레고명'] || '')
            .localeCompare(
              String(b['레고명'] || ''),
              'ko'
            );

        case 'releaseHigh':
          return toNumber(b['출시가']) -
                 toNumber(a['출시가']);

        case 'releaseLow':
          return toNumber(a['출시가']) -
                 toNumber(b['출시가']);

        case 'purchaseHigh':
          return toNumber(b['매입가']) -
                 toNumber(a['매입가']);

        case 'purchaseLow':
          return toNumber(a['매입가']) -
                 toNumber(b['매입가']);

        default:
          return 0;

      }

    });


    document.getElementById(
      'legoCount'
    ).textContent =
      filtered.length;


    if (filtered.length === 0) {

      grid.innerHTML = `
        <div class="empty-state">

          <div class="empty-icon">🧱</div>

          <h3>아직 레고가 없습니다.</h3>

          <p>
            오른쪽 위의 '레고 추가' 버튼으로
            첫 번째 레고를 등록해보세요.
          </p>

        </div>
      `;

      return;

    }


    grid.innerHTML =
      filtered
        .map((item, index) => createLegoCard(item, index))
        .join('');

  }


  /* =========================
     레고 카드/목록 구성 요소 생성
  ========================= */

  function createLegoCard(item, index) {

    const number =
      item['레고 품번'] || '-';

    const name =
      item['레고명'] || '이름 없음';

    const releasePrice =
      toNumber(item['출시가']);

    const ownership =
      item['보유 여부'] || '미보유';

    const boxStatus =
      item['박스 여부'] || '-';

    const purchasePrice =
      toNumber(item['매입가']);

    const soldPrice =
      toNumber(item['되판 가격']);

    const memo =
      item['메모'] || '';


    let badgeClass =
      'not-owned';

    if (ownership === '보유') {
      badgeClass = 'owned';
    }

    if (ownership === '판매함') {
      badgeClass = 'sold';
    }

    const imageUrl = getLegoImageUrl(item);

    const imageHtml =
      imageUrl
        ? `
          <img
            src="${escapeHtml(imageUrl)}"
            alt="${escapeHtml(name)}"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          >

          <div class="image-placeholder fallback" style="display:none;">
            🧱
          </div>
        `
        : `
          <div class="image-placeholder">
            🧱
          </div>
        `;


    return `
      <article class="lego-card" onclick="openDetailModal(${index})">

        <div class="lego-image">

          ${imageHtml}

          <span class="status-badge ${badgeClass}">
            ${escapeHtml(ownership)}
          </span>

        </div>


        <div class="lego-info">

          <div class="lego-number">
            #${escapeHtml(number)}
          </div>

          <h3>
            ${escapeHtml(name)}
          </h3>


          <div class="info-row">

            <span>출시가</span>

            <strong>
              ${formatWon(releasePrice)}
            </strong>

          </div>


          <div class="info-row">

            <span>매입가</span>

            <strong>
              ${formatWon(purchasePrice)}
            </strong>

          </div>


          ${
            ownership === '판매함'
              ? `
                <div class="info-row sold-price">

                  <span>되판 가격</span>

                  <strong>
                    ${formatWon(soldPrice)}
                  </strong>

                </div>
              `
              : ''
          }


          <div class="info-row">

            <span>박스</span>

            <strong>
              ${escapeHtml(boxStatus)}
            </strong>

          </div>


          ${
            memo
              ? `
                <div class="tags">

                  <span class="tag">
                    ${escapeHtml(memo)}
                  </span>

                </div>
              `
              : ''
          }

        </div>

      </article>
    `;

  }


  /* =========================
     요약 정보 계산
  ========================= */

  function updateSummary() {

    const owned =
      legoList.filter(function(item) {

        return item['보유 여부'] === '보유';

      });


    const totalPurchase =
      legoList.reduce(function(total, item) {

        return total +
          toNumber(item['매입가']);

      }, 0);


    const priceDifference =
      legoList.reduce(function(total, item) {

        return total +
          (
            toNumber(item['출시가']) -
            toNumber(item['매입가'])
          );

      }, 0);


    const totalValue =
      owned.reduce(function(total, item) {

        return total +
          toNumber(item['출시가']);

      }, 0);


    document.getElementById(
      'ownedCount'
    ).textContent =
      owned.length + '개';


    document.getElementById(
      'totalPurchase'
    ).textContent =
      formatWon(totalPurchase);


    document.getElementById(
      'priceDifference'
    ).textContent =
      formatWon(priceDifference);


    document.getElementById(
      'totalValue'
    ).textContent =
      formatWon(totalValue);

  }


  /* =========================
     레고 저장
  ========================= */

  async function saveLego(event) {

    event.preventDefault();


    const button =
      event.target.querySelector(
        'button[type="submit"]'
      );


    button.disabled = true;
    button.textContent = '저장 중...';


    const data = {

      '레고 품번':
        document.getElementById(
          'legoNumber'
        ).value.trim(),

      '레고명':
        document.getElementById(
          'legoName'
        ).value.trim(),

      '출시가':
        document.getElementById(
          'releasePrice'
        ).value,

      '보유 여부':
        document.getElementById(
          'ownership'
        ).value,

      '박스 여부':
        document.getElementById(
          'boxStatus'
        ).value,

      '매입가':
        document.getElementById(
          'purchasePrice'
        ).value,

      '되판 가격':
        document.getElementById(
          'soldPrice'
        ).value,

      '메모':
        document.getElementById(
          'memo'
        ).value.trim()

    };


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body:
              JSON.stringify(data)

          }
        );


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.error ||
          '저장에 실패했습니다.'
        );

      }


      alert(
        '레고가 저장되었습니다! 🪄'
      );


      document
        .getElementById('legoForm')
        .reset();


      closeAddModal();

      await loadLegoData();


    } catch (error) {

      console.error(error);

      alert(
        '저장하지 못했습니다.\n\n' +
        error.message
      );

    } finally {

      button.disabled = false;
      button.textContent = '저장하기';

    }

  }


  /* =========================
     레고 추가 모달 조작
  ========================= */

  function openAddModal() {

    document
      .getElementById('addModal')
      .classList.add('show');

  }

  function closeAddModal() {

    document
      .getElementById('addModal')
      .classList.remove('show');

  }


  /* =========================
     레고 상세 보기 모달 조작
  ========================= */

  function openDetailModal(index) {
    const item = legoList[index];
    if (!item) return;

    const imageUrl = getLegoImageUrl(item);
    const detailImg = document.getElementById('detailImage');
    
    if (imageUrl) {
      detailImg.src = imageUrl;
      detailImg.style.display = 'block';
    } else {
      detailImg.style.display = 'none';
    }

    document.getElementById('detailNumber').textContent = '#' + (item['레고 품번'] || '-');
    document.getElementById('detailName').textContent = item['레고명'] || '이름 없음';
    
    const badge = document.getElementById('detailBadge');
    const ownership = item['보유 여부'] || '미보유';
    badge.textContent = ownership;
    badge.className = 'status-badge ' + (ownership === '보유' ? 'owned' : ownership === '판매함' ? 'sold' : 'not-owned');

    document.getElementById('detailReleasePrice').textContent = formatWon(toNumber(item['출시가']));
    document.getElementById('detailPurchasePrice').textContent = formatWon(toNumber(item['매입가']));

    const soldRow = document.getElementById('detailSoldRow');
    if (ownership === '판매함') {
      soldRow.classList.remove('hidden');
      document.getElementById('detailSoldPrice').textContent = formatWon(toNumber(item['되판 가격']));
    } else {
      soldRow.classList.add('hidden');
    }

    document.getElementById('detailBoxStatus').textContent = item['박스 여부'] || '-';
    document.getElementById('detailMemo').textContent = item['메모'] || '기록된 메모가 없습니다.';

    document.getElementById('detailModal').classList.add('show');
  }

  function closeDetailModal() {
    document.getElementById('detailModal').classList.remove('show');
  }


  /* =========================
     배경 클릭으로 모달 닫기
  ========================= */

  function closeModalBackground(event, modalId) {

    if (event.target.id === modalId) {
      if (modalId === 'addModal') closeAddModal();
      if (modalId === 'detailModal') closeDetailModal();
    }

  }


  /* =========================
     유틸리티 함수
  ========================= */

  function toNumber(value) {

    if (
      value === null ||
      value === undefined ||
      value === ''
    ) {
      return 0;
    }

    return Number(
      String(value)
        .replace(/,/g, '')
        .replace(/원/g, '')
    ) || 0;

  }

  function formatWon(value) {

    return (
      Math.round(value)
        .toLocaleString('ko-KR')
      + '원'
    );

  }

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  /* =========================
     로딩 및 에러 상태
  ========================= */

  function showLoading() {

    document.getElementById(
      'legoGrid'
    ).innerHTML = `
      <div class="empty-state">

        <div class="empty-icon loading">
          ✨
        </div>

        <h3>레고 목록을 불러오는 중...</h3>

        <p>
          잠시만 기다려주세요.
        </p>

      </div>
    `;

  }

  function showError(message) {

    document.getElementById(
      'legoGrid'
    ).innerHTML = `
      <div class="empty-state">

        <div class="empty-icon">
          ⚡
        </div>

        <h3>불러오지 못했습니다.</h3>

        <p>
          ${message}
        </p>

        <button
          type="button"
          class="primary-button retry-button"
          onclick="loadLegoData()"
        >
          다시 불러오기
        </button>

      </div>
    `;

  }

</script>
