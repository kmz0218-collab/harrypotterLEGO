<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레고 컬렉션 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    .glass-effect {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-30 glass-effect border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-red-500 text-white p-2 rounded-xl shadow-md">
          <i class="fa-solid me-0 fa-cubes text-xl"></i>
        </div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-red-600 to-amber-600 bg-clip-text text-transparent">
          LEGO Archive
        </h1>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="fetchData()" class="p-2 text-slate-600 hover:text-red-600 hover:bg-slate-100 rounded-lg transition" title="새로고침">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button onclick="openFormModal()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center shadow-sm transition">
          <i class="fa-solid fa-plus mr-1.5"></i> 레고 추가
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

    <!-- 검색 및 필터 컨트롤 -->
    <div class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200/80 mb-6 space-y-4">
      <div class="flex flex-col md:flex-row gap-3">
        <!-- 검색창 -->
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="품번 또는 레고명 검색..." 
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-sm transition">
        </div>

        <!-- 필터들 -->
        <div class="flex flex-wrap items-center gap-2">
          <select id="ownedFilter" onchange="renderList()" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:border-red-500">
            <option value="ALL">보유 여부: 전체</option>
            <option value="O">보유 중 (O)</option>
            <option value="X">미보유 (X)</option>
          </select>

          <select id="boxFilter" onchange="renderList()" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:border-red-500">
            <option value="ALL">박스 여부: 전체</option>
            <option value="O">박스 있음 (O)</option>
            <option value="X">박스 없음 (X)</option>
          </select>

          <!-- 뷰 모드 변경 -->
          <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200/60 ml-auto md:ml-0">
            <button id="viewGridBtn" onclick="setViewMode('grid')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-800 shadow-sm transition">
              <i class="fa-solid fa-border-all"></i>
            </button>
            <button id="viewTableBtn" onclick="setViewMode('table')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
              <i class="fa-solid fa-list"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 로딩 상태 -->
    <div id="loadingState" class="py-20 text-center">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-slate-200 border-t-red-600 mb-3"></div>
      <p class="text-slate-500 text-sm font-medium">데이터를 불러오는 중입니다...</p>
    </div>

    <!-- 데이터 목록 영역 -->
    <div id="contentArea" class="hidden">
      <!-- 카드 뷰 -->
      <div id="gridView" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

      <!-- 테이블 뷰 -->
      <div id="tableView" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase font-semibold">
              <tr>
                <th class="px-4 py-3.5">품번</th>
                <th class="px-4 py-3.5">레고명</th>
                <th class="px-4 py-3.5">보유</th>
                <th class="px-4 py-3.5">박스</th>
                <th class="px-4 py-3.5 text-right">출시가</th>
                <th class="px-4 py-3.5 text-right">매입가</th>
                <th class="px-4 py-3.5 text-right">되판가격</th>
                <th class="px-4 py-3.5 text-center">관리</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <!-- 검색 결과 없음 -->
      <div id="emptyState" class="hidden py-20 text-center bg-white rounded-2xl border border-slate-200">
        <i class="fa-solid fa-box-open text-4xl text-slate-300 mb-3"></i>
        <p class="text-slate-600 font-medium">조건에 일치하는 레고 데이터가 없습니다.</p>
      </div>

      <!-- 페이지네이션 -->
      <div id="pagination" class="mt-6 flex items-center justify-between bg-white px-4 py-3 rounded-xl border border-slate-200 text-sm">
        <button id="prevBtn" onclick="changePage(-1)" class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:hover:bg-white transition">
          <i class="fa-solid fa-chevron-left mr-1"></i> 이전
        </button>
        <span id="pageInfo" class="text-slate-500 font-medium">1 / 1 페이지</span>
        <button id="nextBtn" onclick="changePage(1)" class="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:hover:bg-white transition">
          다음 <i class="fa-solid fa-chevron-right ml-1"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- 상세정보 모달 -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <span id="detailBadge" class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-100 text-slate-600"></span>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <p id="detailNumber" class="text-xs text-slate-400 font-semibold mb-0.5"></p>
          <h3 id="detailName" class="text-xl font-bold text-slate-800"></h3>
        </div>

        <div class="grid grid-cols-2 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs">
          <div><span class="text-slate-400 block mb-1">출시가</span><strong id="detailRetail" class="text-sm text-slate-700"></strong></div>
          <div><span class="text-slate-400 block mb-1">매입가</span><strong id="detailPurchase" class="text-sm text-slate-700"></strong></div>
          <div><span class="text-slate-400 block mb-1">되판 가격</span><strong id="detailResale" class="text-sm text-slate-700"></strong></div>
          <div><span class="text-slate-400 block mb-1">박스 유무</span><strong id="detailBox" class="text-sm text-slate-700"></strong></div>
        </div>

        <div>
          <span class="text-xs text-slate-400 block mb-1">메모</span>
          <div id="detailMemo" class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-sm text-slate-600 min-h-[60px] whitespace-pre-wrap"></div>
        </div>
      </div>

      <div class="p-4 bg-slate-50 border-t border-slate-100 flex justify-between gap-2">
        <button onclick="deleteCurrentItem()" class="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl text-sm font-semibold transition flex items-center">
          <i class="fa-solid fa-trash-can mr-1.5"></i> 삭제
        </button>
        <div class="flex gap-2">
          <button onclick="editCurrentItem()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-semibold transition">
            수정
          </button>
          <button onclick="closeDetailModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-semibold transition">
            닫기
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 등록/수정 모달 -->
  <div id="formModal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden max-h-[90vh] flex flex-col">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <h3 id="formTitle" class="text-lg font-bold text-slate-800">레고 추가</h3>
        <button onclick="closeFormModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="legoForm" onsubmit="handleFormSubmit(event)" class="p-6 overflow-y-auto space-y-4 text-sm flex-1">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">레고 품번 *</label>
            <input type="text" id="inputNumber" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">레고명 *</label>
            <input type="text" id="inputName" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">보유 여부</label>
            <select id="inputOwned" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-red-500">
              <option value="O">보유 (O)</option>
              <option value="X">미보유 (X)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">박스 여부</label>
            <select id="inputBox" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-red-500">
              <option value="O">있음 (O)</option>
              <option value="X">없음 (X)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">출시가(원)</label>
            <input type="number" id="inputRetail" placeholder="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-red-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">매입가(원)</label>
            <input type="number" id="inputPurchase" placeholder="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-red-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">되판 가격(원)</label>
            <input type="number" id="inputResale" placeholder="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-red-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">메모</label>
          <textarea id="inputMemo" rows="3" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-red-500 resize-none"></textarea>
        </div>

        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeFormModal()" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-50 transition">취소</button>
          <button type="submit" id="submitBtn" class="px-5 py-2 bg-red-600 text-white rounded-xl font-semibold hover:bg-red-700 transition">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 업데이트된 최신 Apps Script API URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbxUnBlqaFdTPU35exUbNzXx6weWhpHpGSwAO96-5ot2qbNLupyuga-As1OnJ45oyeBlAw/exec';

    let legoList = [];
    let filteredList = [];
    let currentViewMode = 'grid';
    let currentDetailIndex = null;
    let currentPage = 1;
    const ITEMS_PER_PAGE = 12;

    document.addEventListener('DOMContentLoaded', fetchData);

    // 구글 시트 데이터 불러오기
    function fetchData() {
      showLoading(true);
      fetch(API_URL)
        .then(res => res.json())
        .then(response => {
          if (response.success && response.data) {
            legoList = response.data;
            applyFilters();
          } else {
            alert('데이터를 가져오는데 실패했습니다.');
          }
        })
        .catch(err => {
          console.error(err);
          alert('데이터 연결 중 오류가 발생했습니다.');
        })
        .finally(() => showLoading(false));
    }

    function showLoading(isLoading) {
      document.getElementById('loadingState').classList.toggle('hidden', !isLoading);
      document.getElementById('contentArea').classList.toggle('hidden', isLoading);
    }

    // 검색 및 필터링
    function handleSearch() {
      currentPage = 1;
      applyFilters();
    }

    function applyFilters() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const owned = document.getElementById('ownedFilter').value;
      const box = document.getElementById('boxFilter').value;

      filteredList = legoList.filter(item => {
        const itemNum = String(item['레고 품번'] || '').toLowerCase();
        const itemName = String(item['레고명'] || '').toLowerCase();
        const matchKeyword = itemNum.includes(keyword) || itemName.includes(keyword);

        const itemOwned = String(item['보유 여부'] || '').toUpperCase();
        const matchOwned = (owned === 'ALL') || (itemOwned === owned);

        const itemBox = String(item['박스 여부'] || '').toUpperCase();
        const matchBox = (box === 'ALL') || (itemBox === box);

        return matchKeyword && matchOwned && matchBox;
      });

      renderList();
    }

    // 목록 랜더링
    function renderList() {
      const emptyState = document.getElementById('emptyState');
      const gridView = document.getElementById('gridView');
      const tableView = document.getElementById('tableView');
      const tableBody = document.getElementById('tableBody');

      if (filteredList.length === 0) {
        emptyState.classList.remove('hidden');
        gridView.classList.add('hidden');
        tableView.classList.add('hidden');
        document.getElementById('pagination').classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      document.getElementById('pagination').classList.remove('hidden');

      // 페이지네이션 계산
      const totalPages = Math.ceil(filteredList.length / ITEMS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginatedItems = filteredList.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      document.getElementById('pageInfo').innerText = `${currentPage} / ${totalPages} 페이지`;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage === totalPages;

      if (currentViewMode === 'grid') {
        gridView.classList.remove('hidden');
        tableView.classList.add('hidden');
        gridView.innerHTML = paginatedItems.map((item, idx) => {
          const globalIndex = legoList.indexOf(item);
          const isOwned = item['보유 여부'] === 'O';
          return `
            <div onclick="openDetailModal(${globalIndex})" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition cursor-pointer flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-bold px-2.5 py-1 rounded-md ${isOwned ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-500'}">
                    ${isOwned ? '보유중' : '미보유'}
                  </span>
                  <span class="text-xs text-slate-400 font-semibold">#${item['레고 품번']}</span>
                </div>
                <h4 class="font-bold text-slate-800 line-clamp-1 mb-3">${item['레고명']}</h4>
              </div>

              <div class="pt-3 border-t border-slate-100 text-xs space-y-1.5 text-slate-500">
                <div class="flex justify-between"><span>출시가</span> <strong class="text-slate-700">${formatMoney(item['출시가'])}</strong></div>
                <div class="flex justify-between"><span>매입가</span> <strong class="text-slate-700">${formatMoney(item['매입가'])}</strong></div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        gridView.classList.add('hidden');
        tableView.classList.remove('hidden');
        tableBody.innerHTML = paginatedItems.map((item) => {
          const globalIndex = legoList.indexOf(item);
          return `
            <tr onclick="openDetailModal(${globalIndex})" class="hover:bg-slate-50 cursor-pointer transition">
              <td class="px-4 py-3 font-semibold text-slate-800">${item['레고 품번']}</td>
              <td class="px-4 py-3 font-medium text-slate-800">${item['레고명']}</td>
              <td class="px-4 py-3"><span class="text-xs px-2 py-0.5 rounded font-bold ${item['보유 여부'] === 'O' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">${item['보유 여부']}</span></td>
              <td class="px-4 py-3">${item['박스 여부']}</td>
              <td class="px-4 py-3 text-right">${formatMoney(item['출시가'])}</td>
              <td class="px-4 py-3 text-right">${formatMoney(item['매입가'])}</td>
              <td class="px-4 py-3 text-right">${formatMoney(item['되판 가격'])}</td>
              <td class="px-4 py-3 text-center">
                <button onclick="event.stopPropagation(); openDetailModal(${globalIndex})" class="text-slate-400 hover:text-slate-600 p-1">
                  <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
              </td>
            </tr>
          `;
        }).join('');
      }
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('viewGridBtn').className = mode === 'grid' 
        ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-800 shadow-sm transition' 
        : 'px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 transition';
      document.getElementById('viewTableBtn').className = mode === 'table' 
        ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-800 shadow-sm transition' 
        : 'px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 transition';
      renderList();
    }

    function changePage(direction) {
      currentPage += direction;
      renderList();
    }

    // 상세보기 모달
    function openDetailModal(index) {
      currentDetailIndex = index;
      const item = legoList[index];

      const isOwned = item['보유 여부'] === 'O';
      const badge = document.getElementById('detailBadge');
      badge.innerText = isOwned ? '보유중' : '미보유';
      badge.className = `px-2.5 py-1 rounded-md text-xs font-bold ${isOwned ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-500'}`;

      document.getElementById('detailNumber').innerText = `품번: #${item['레고 품번']}`;
      document.getElementById('detailName').innerText = item['레고명'];
      document.getElementById('detailRetail').innerText = formatMoney(item['출시가']);
      document.getElementById('detailPurchase').innerText = formatMoney(item['매입가']);
      document.getElementById('detailResale').innerText = formatMoney(item['되판 가격']);
      document.getElementById('detailBox').innerText = item['박스 여부'] === 'O' ? '있음 (O)' : '없음 (X)';
      document.getElementById('detailMemo').innerText = item['메모'] || '작성된 메모가 없습니다.';

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    // 항목 삭제 기능
    function deleteCurrentItem() {
      if (currentDetailIndex === null) return;
      const item = legoList[currentDetailIndex];

      if (!confirm(`'${item['레고명']}' (#${item['레고 품번']}) 항목을 완전 삭제하시겠습니까?`)) {
        return;
      }

      showLoading(true);
      closeDetailModal();

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'delete',
          '레고 품번': item['레고 품번']
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('성공적으로 삭제되었습니다.');
          fetchData(); // 삭제 후 최신 시트 데이터 재조회
        } else {
          alert('삭제 실패: ' + (res.error || '알 수 없는 오류'));
          showLoading(false);
        }
      })
      .catch(err => {
        console.error(err);
        alert('삭제 요청 중 오류가 발생했습니다.');
        showLoading(false);
      });
    }

    // 등록 / 수정 모달
    function openFormModal(editIndex = null) {
      const isEdit = editIndex !== null;
      document.getElementById('formTitle').innerText = isEdit ? '레고 정보 수정' : '새 레고 추가';
      
      const numInput = document.getElementById('inputNumber');
      if (isEdit) {
        const item = legoList[editIndex];
        numInput.value = item['레고 품번'];
        numInput.readOnly = true; // 수정 시 품번 변경 불가
        numInput.classList.add('bg-slate-200');

        document.getElementById('inputName').value = item['레고명'] || '';
        document.getElementById('inputOwned').value = item['보유 여부'] || 'O';
        document.getElementById('inputBox').value = item['박스 여부'] || 'O';
        document.getElementById('inputRetail').value = item['출시가'] || '';
        document.getElementById('inputPurchase').value = item['매입가'] || '';
        document.getElementById('inputResale').value = item['되판 가격'] || '';
        document.getElementById('inputMemo').value = item['메모'] || '';
      } else {
        document.getElementById('legoForm').reset();
        numInput.readOnly = false;
        numInput.classList.remove('bg-slate-200');
      }

      document.getElementById('formModal').classList.remove('hidden');
    }

    function editCurrentItem() {
      const index = currentDetailIndex;
      closeDetailModal();
      openFormModal(index);
    }

    function closeFormModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      const payload = {
        '레고 품번': document.getElementById('inputNumber').value,
        '레고명': document.getElementById('inputName').value,
        '보유 여부': document.getElementById('inputOwned').value,
        '박스 여부': document.getElementById('inputBox').value,
        '출시가': Number(document.getElementById('inputRetail').value) || 0,
        '매입가': Number(document.getElementById('inputPurchase').value) || 0,
        '되판 가격': Number(document.getElementById('inputResale').value) || 0,
        '메모': document.getElementById('inputMemo').value
      };

      closeFormModal();
      showLoading(true);

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('성공적으로 저장되었습니다.');
          fetchData();
        } else {
          alert('저장 실패: ' + (res.error || '알 수 없는 오류'));
          showLoading(false);
        }
      })
      .catch(err => {
        console.error(err);
        alert('저장 도중 오류가 발생했습니다.');
        showLoading(false);
      });
    }

    function formatMoney(amount) {
      if (!amount && amount !== 0) return '0원';
      return Number(amount).toLocaleString('ko-KR') + '원';
    }
  </script>
</body>
</html>
